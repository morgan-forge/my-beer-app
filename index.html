<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#0f0e09">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="My Beer">
	<link rel="apple-touch-icon" href="apple-touch-icon.png">
	<link rel="icon" type="image/png" href="apple-touch-icon.png">
	<title>My Beer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="manifest" href="manifest.json">
</head>

<body>
	<div id="landing" class="landing">
		<div class="landing-inner">
			<h1>My Beer</h1>
			<p>Load your beer journal to get started.</p>
			<p class="landing-hint">Pick <strong>beer-journal-YYYY-MM-DD.json</strong> from <code>beer-data-files-private</code>.</p>
			<button id="btnLoadRatings" class="landing-btn" type="button">Load journal</button>
			<input id="ratingsFileInput" type="file" accept=".json,application/json,text/plain" hidden>
		</div>
	</div>
	<div id="appContent" class="app-content hidden">
		<div class="sticky-top">
			<header>
				<div class="header-main-row">
					<h1>My Beer</h1>
				</div>
				<div id="beerStats" class="beer-stats"></div>
			</header>
			<div id="loadRatingsPrompt" class="load-prompt hidden">
				<p>Load your beer journal (<strong>beer-journal-YYYY-MM-DD.json</strong>).</p>
				<button type="button" id="btnLoadRatingsInApp" class="landing-btn">Load journal file</button>
			</div>

			<div class="controls">
				<div class="search-row">
					<div class="search-container">
						<input type="text" id="searchInput" placeholder="Search beer or brewery..." autocomplete="off">
						<button id="clearSearch" class="clear-btn" type="button" aria-label="Clear search">✕</button>
						<button class="filter-toggle filter-toggle--inset" id="filterToggle" type="button" aria-label="Filter by style or brewery">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
							<span id="filterBadge" class="filter-badge hidden"></span>
						</button>
					</div>
					<button type="button" id="btnUpload" class="btn-upload-icon" aria-label="Upload a data file">
						<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
					</button>
				</div>
				<div class="filter-lens" role="toolbar" aria-label="Active filters and view">
					<span id="filterCount" class="filter-count"></span>
					<div id="activeFilterPills" class="active-filter-pills"></div>
				</div>
			</div>

			<div id="filterPanel" class="filter-panel">
				<div class="filter-section">
					<div class="filter-section-label">STYLE</div>
					<div class="chip-row" id="chipsStyle"></div>
				</div>
				<div class="filter-section">
					<div class="filter-section-label">BREWERY</div>
					<div class="chip-row" id="chipsBrewery"></div>
				</div>
				<div class="filter-done-row">
					<button id="filterClearAll" class="filter-clear-btn" type="button">Clear all</button>
					<button id="filterDone" class="filter-done-btn" type="button">Done ✓</button>
				</div>
			</div>
		</div>

		<div id="journalDashboard" class="journal-dashboard hidden" aria-label="Journal palate dashboard"></div>
		<div id="journalSortArea" class="hidden">
			<div class="journal-sort-bar" id="journalSortBar" role="toolbar" aria-label="Journal sort"></div>
		</div>

		<div class="list" id="beerList"><p style="color:var(--text-dim);padding:20px;">Loading…</p></div>
		<div id="journalMore" class="journal-more hidden"></div>
		<div id="journalPalate" class="journal-palate hidden" aria-label="Journal palate insights"></div>
	</div>

	<script src="app.js"></script>
</body>

</html>
